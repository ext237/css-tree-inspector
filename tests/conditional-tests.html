<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Conditional CSS tests</title>
  <style>
    .wrapper { container-type: inline-size; container-name: sidebar; }
    @media (max-width: 800px) { .card { padding: 20px; } .irrelevant { color: red; } }
    @media (min-width: 1200px) { .card { max-width: 1100px; } }
    @media print { .card { color: black; } }
    @media (orientation: portrait) { .card { display: block; } }
    @media (prefers-color-scheme: dark) { .card { background: #111; } }
    @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
    @media (hover: hover) { .card:hover { background: red; } }
    @media (pointer: coarse) { .card { min-height: 48px; } }
    @media screen and (min-width: 768px) and (orientation: landscape) { .card { display: flex; } }
    @container sidebar (width > 400px) { .card { display: grid; } }
    @media (max-width: 900px) { @container (width > 400px) { .card { gap: 10px; } } }
    @container (width > 400px) { @media (prefers-color-scheme: dark) { .card { color: white; } } }
    @media (hover: hover) and (min-width: 800px) { .card:hover .title { color: red; } }
  </style>
</head>
<body>
  <div class="wrapper"><div class="card"><span class="title">Title</span></div></div>
  <pre id="results">Running…</pre>
  <script src="../lib/inspector-source.js"></script>
  <script>
    const assertions = [];
    function check(condition, message) {
      assertions.push(`${condition ? "PASS" : "FAIL"}: ${message}`);
      if (!condition) document.documentElement.dataset.failed = "true";
    }
    function inspect(selector) {
      globalThis.$0 = document.querySelector(selector);
      return JSON.parse(eval(CSS_TREE_INSPECTOR_EXPRESSION("json")).output);
    }
    function mediaEntry(entries, condition) {
      return entries.find((entry) => entry.conditions.some((item) => item.type === "media" && item.condition === condition));
    }

    const report = inspect(".card");
    const entries = report.rootElement.conditionalCSS;
    for (const condition of [
      "(max-width: 800px)", "(min-width: 1200px)", "print", "(orientation: portrait)",
      "(prefers-color-scheme: dark)", "(prefers-reduced-motion: reduce)", "(hover: hover)",
      "(pointer: coarse)", "screen and (min-width: 768px) and (orientation: landscape)"
    ]) {
      const entry = mediaEntry(entries, condition);
      const media = entry && entry.conditions.find((item) => item.condition === condition);
      check(Boolean(entry), `media condition captured: ${condition}`);
      check(media && media.currentlyMatches === matchMedia(condition).matches, `currentlyMatches is correct: ${condition}`);
    }
    check(!entries.some((entry) => entry.selector === ".irrelevant"), "irrelevant conditional selector is excluded");
    const container = entries.find((entry) => entry.conditions.some((item) => item.type === "container" && item.condition.includes("sidebar")));
    check(container && container.conditions.find((item) => item.type === "container").currentlyMatches === null, "named container query is captured without invented applicability");
    check(entries.some((entry) => entry.conditions.map((item) => item.type).join(",") === "media,container"), "media containing container preserves nesting order");
    check(entries.some((entry) => entry.conditions.map((item) => item.type).join(",") === "container,media"), "container containing media preserves nesting order");

    const title = inspect(".title").rootElement;
    const conditionalState = title.conditionalCSS.find((entry) => entry.selector === ".card:hover .title");
    check(conditionalState && conditionalState.states.includes(":hover"), "conditional ancestor-state selector is captured");
    check(title.stateCSS.some((entry) => entry.selector === ".card:hover .title"), "conditional state remains available in stateCSS");

    globalThis.$0 = document.body;
    const css = eval(CSS_TREE_INSPECTOR_EXPRESSION("css")).output;
    check(css.includes("@container sidebar (width > 400px)"), "container context is preserved in CSS export");
    check(css.includes("@media (max-width: 900px)"), "nested media context is preserved in CSS export");
    check(css.split(".card:hover .title").length - 1 === 1, "conditional state rule is not duplicated in CSS export");
    check(Object.keys(report).at(-1) === "outerHTML", "outerHTML remains the final JSON property");

    document.querySelector("#results").textContent = assertions.join("\n");
  </script>
</body>
</html>
